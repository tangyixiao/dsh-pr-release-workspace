name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        react: [locked, host-18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # React is supplied by DSH at runtime. The React 19 development renderer
      # must not hide regressions against the existing React 18 host contract.
      - if: matrix.react == 'host-18'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1
      - run: npm run build
      - run: npm test

  # Branch protection requires the stable "test" context. Matrix job names
  # include their dimensions, so aggregate every renderer/platform result here.
  test:
    needs: renderer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every renderer to pass
        env:
          RENDERER_RESULT: ${{ needs.renderer.result }}
        run: test "$RENDERER_RESULT" = success
